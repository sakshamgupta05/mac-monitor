<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
html,body{margin:0;background:transparent}#process-options{color-scheme:light dark;--pt-surface:light-dark(#fcfcfb,#1a1a19);--pt-text:light-dark(#171717,#efefec);--pt-muted:light-dark(#62615d,#a6a59d);--pt-line:light-dark(#deded8,#33332f);--pt-hover:light-dark(#f1f2ef,#222421);--pt-blue:light-dark(#2a78d6,#5797e8);font:13px/1.45 system-ui,-apple-system,sans-serif;color:var(--pt-text)}#process-options *{box-sizing:border-box}#process-options .intro{margin:0 0 16px;color:var(--pt-muted);font-size:12px}#process-options .option{margin-bottom:22px}#process-options .option:last-child{margin-bottom:0}#process-options .option-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}#process-options h3{font-size:15px;font-weight:500;margin:0}#process-options .description{font-size:12px;color:var(--pt-muted)}#process-options .surface{padding:12px 14px 8px;border:1px solid var(--pt-line);border-radius:10px;background:var(--pt-surface);min-width:0}#process-options .table-scroll{overflow-x:auto;max-width:100%}#process-options table{width:100%;min-width:660px;table-layout:fixed;border-collapse:collapse;font-size:12px}#process-options td,#process-options th{border-bottom:1px solid var(--pt-line);padding:8px 6px;text-align:right;position:relative;font-variant-numeric:tabular-nums;white-space:nowrap}#process-options th{color:var(--pt-muted);font-weight:400;padding:6px}#process-options th:first-child,#process-options td:first-child{text-align:left}#process-options th button{font:inherit;color:inherit;background:transparent;border:0;padding:0;text-align:inherit;cursor:pointer}#process-options th[aria-sort=descending]{color:var(--pt-text)}#process-options tr:last-child td{border-bottom:0}#process-options tbody tr:hover{background:var(--pt-hover)}#process-options .value{position:relative;z-index:1}#process-options .name{font-weight:500;overflow:hidden;text-overflow:ellipsis}#process-options .meter{position:absolute;left:6px;top:calc(50% - 9px);height:18px;width:calc((100% - 12px) * var(--share));background:var(--pt-blue);opacity:.15;border-radius:2px;pointer-events:none}#process-options .underline td{padding-top:7px;padding-bottom:13px}#process-options .underline .meter,#process-options .focus .meter{top:auto;bottom:5px;height:2px;opacity:.65;border-radius:0}#process-options .dot-wrap{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;width:100%}#process-options .dot-slot{width:12px;display:inline-flex;justify-content:center;align-items:center;flex:none}#process-options .dot{display:block;width:calc(10px * var(--diameter));height:calc(10px * var(--diameter));border-radius:50%;background:var(--pt-blue);opacity:.75}#process-options .focus td:not(:first-child):not(.selected){color:var(--pt-muted)}#process-options .focus td.selected .value{font-weight:500}#process-options .focus th.selected{color:var(--pt-text)}#process-options .foot{margin:7px 0 0;font-size:11px;color:var(--pt-muted)}#process-options .focus-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--pt-muted);margin:0 0 8px}#process-options select{font:inherit;color:var(--pt-text);background:var(--pt-surface);border:1px solid var(--pt-line);border-radius:5px;padding:4px 6px}#process-options .swatch{display:inline-block;width:10px;height:2px;background:var(--pt-blue);margin-right:5px;vertical-align:middle}@media(pointer:coarse){#process-options select{min-height:44px}#process-options th button{min-height:32px}}@media(max-width:520px){#process-options .surface{padding:10px 8px 6px}}
</style></head><body><main id="process-options">
<p class="intro">Same illustrative snapshot in every option. Marks compare consumers within each resource column; they don’t indicate saturation or danger.</p>
<div id="variants"></div>
</main><script>
(()=>{const root=document.getElementById('process-options');const host=root.querySelector('#variants');
const rows=[{name:'node',cpu:211,mem:5.01,gpu:0,power:4.26,read:.552,write:.00795,count:38},{name:'python3.12',cpu:193,mem:1.09,gpu:0,power:4.75,read:.568,write:.121,count:8},{name:'arudha-engine',cpu:131,mem:.258,gpu:0,power:3.44,read:0,write:0,count:26},{name:'postgres',cpu:69,mem:2.04,gpu:0,power:1.1,read:5.18,write:35.7,count:47},{name:'UTM',cpu:23,mem:7.35,gpu:.1,power:.22,read:.0258,write:.0954,count:6},{name:'Brave Browser',cpu:19,mem:1.44,gpu:1.4,power:.27,read:.0457,write:.256,count:12}];
const rate=v=>v===0?'0 B/s':v>=1?v.toFixed(2)+' MB/s':(v*1000).toFixed(v*1000>=100?0:1)+' KB/s';const columns=[{id:'name',label:'Group',fmt:r=>r.name},{id:'cpu',label:'CPU',fmt:r=>r.cpu+'%'},{id:'mem',label:'Memory',fmt:r=>r.mem>=1?r.mem.toFixed(2)+' GB':Math.round(r.mem*1000)+' MB'},{id:'gpu',label:'GPU',fmt:r=>r.gpu.toFixed(1)+'%'},{id:'power',label:'CPU W',fmt:r=>r.power.toFixed(2)+' W'},{id:'read',label:'Read/s',fmt:r=>rate(r.read)},{id:'write',label:'Write/s',fmt:r=>rate(r.write)},{id:'count',label:'Procs',fmt:r=>String(r.count)}];
const peaks=Object.fromEntries(columns.filter(c=>c.id!=='name').map(c=>[c.id,Math.max(...rows.map(r=>r[c.id]))]));
const configs=[{id:'fill',title:'Soft data bars',description:'A quiet fill behind each value makes larger consumers easy to spot.',foot:'Strongest visual emphasis; row height stays compact.'},{id:'underline',title:'Thin underlines',description:'A tiny bar beneath each value leaves the text and background clean.',foot:'Subtle emphasis across all resources, with slightly taller rows.'},{id:'dots',title:'Proportional dots',description:'Dot area grows with usage; there are no shaded cells or bars.',foot:'Lowest visual weight; close values are harder to compare.'},{id:'focus',title:'Column focus',description:'Emphasize one resource and rank its consumers; keep the other values visible.',foot:'Click a resource header or use the selector to change focus.'}];
for(const config of configs){let sort=config.id==='focus'?'mem':'cpu';let descending=true;const section=document.createElement('section');section.className='option '+config.id;section.setAttribute('aria-label',config.title);const head=document.createElement('div');head.className='option-head';const title=document.createElement('h3');title.textContent=config.title;const description=document.createElement('span');description.className='description';description.textContent=config.description;head.append(title,description);section.append(head);const surface=document.createElement('div');surface.className='surface';let picker=null;if(config.id==='focus'){const label=document.createElement('label');label.className='focus-control';label.append('Emphasize');picker=document.createElement('select');picker.setAttribute('aria-label','Resource to emphasize');for(const c of columns.filter(c=>!['name','count'].includes(c.id))){const opt=document.createElement('option');opt.value=c.id;opt.textContent=c.label;picker.append(opt);}picker.value=sort;picker.addEventListener('change',()=>{sort=picker.value;descending=true;render();});label.append(picker);surface.append(label);}const scroll=document.createElement('div');scroll.className='table-scroll';const foot=document.createElement('p');foot.className='foot';foot.textContent=config.foot;surface.append(scroll,foot);section.append(surface);host.append(section);
function render(){const table=document.createElement('table');table.setAttribute('aria-label',config.title+' process comparison');table.innerHTML='<colgroup><col style="width:22%"><col style="width:10%"><col style="width:12%"><col style="width:8%"><col style="width:10%"><col style="width:14%"><col style="width:15%"><col style="width:9%"></colgroup>';const thead=document.createElement('thead'),tr=document.createElement('tr');for(const c of columns){const th=document.createElement('th');const active=sort===c.id;th.setAttribute('aria-sort',active?(descending?'descending':'ascending'):'none');if(config.id==='focus'&&active)th.className='selected';const btn=document.createElement('button');btn.type='button';btn.textContent=c.label+(active?(descending?' ↓':' ↑'):'');btn.addEventListener('click',()=>{if(config.id==='focus'&&['name','count'].includes(c.id))return;descending=sort===c.id?!descending:true;sort=c.id;if(picker)picker.value=sort;render();});th.append(btn);tr.append(th);}thead.append(tr);table.append(thead);const body=document.createElement('tbody');const sorted=[...rows].sort((a,b)=>{const delta=sort==='name'?a.name.localeCompare(b.name):a[sort]-b[sort];return descending?-delta:delta;});for(const row of sorted){const tr=document.createElement('tr');for(const c of columns){const td=document.createElement('td');if(c.id==='name'){td.className='name';td.textContent=c.fmt(row);}else{const share=peaks[c.id]>0?row[c.id]/peaks[c.id]:0;td.style.setProperty('--share',String(share));td.style.setProperty('--diameter',String(Math.sqrt(share)));const value=document.createElement('span');value.className='value';value.textContent=c.fmt(row);const resource=c.id!=='count';td.title=resource?Math.round(share*100)+'% of the largest value in this sample’s '+c.label+' column. This is not a capacity percentage.':'';if(resource&&config.id==='dots'){const wrap=document.createElement('span');wrap.className='dot-wrap';const slot=document.createElement('span');slot.className='dot-slot';slot.setAttribute('aria-hidden','true');const dot=document.createElement('span');dot.className='dot';slot.append(dot);wrap.append(slot,value);td.append(wrap);}else{if(resource&&(config.id!=='focus'||sort===c.id)){const meter=document.createElement('span');meter.className='meter';meter.setAttribute('aria-hidden','true');td.append(meter);}td.append(value);}if(config.id==='focus'&&sort===c.id)td.classList.add('selected');}tr.append(td);}body.append(tr);}table.append(body);scroll.replaceChildren(table);}render();}
})();
</script></body></html>
