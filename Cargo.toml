[package]
name = "mac-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Low-overhead system monitor and dashboard for Apple Silicon Macs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sakshamgupta05/mac-monitor"
keywords = ["macos", "apple-silicon", "monitoring", "dashboard", "power"]
categories = ["command-line-utilities", "visualization"]
include = ["/src/**", "/build.rs", "/web/dist/**", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
core-foundation = "0.10"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.191"
macmon = { version = "0.10", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "signal", "sync", "macros"] }
yaml_serde = "0.10.7"
zstd = "0.14.3"

[build-dependencies]
flate2 = "1.1.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
